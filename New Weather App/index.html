<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Weather App</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" >
        
    </head>
    <body>
        <main class="main-container">
            <header class="main-container">
                <input class="city-input" placeholder="Search City">
                <button class="search-btn">
                    <span class="material-symbols-outlined">search</span>
                </button>

                <section class="weather-info" style="display: none;">
                    <div class="location-date-container">
                        <div class="location">
                        <span class="material-symbols-outlined">location_on</span>
                            <h4 class="country-txt">Johannesburg</h4>
                        </div>
                        <h5 class="current-date-txt regular-txt">Fri, 11 April</h5>
                    </div>
                    <div class="weather-summary-container">
                        <img src="weather-icons/forecast-thunderstorms.png" class="weather-summary-img">
                        <div class="weather-summary-info">
                            <h1 class="temp-txt">29°C</h1>
                            <h3 class="condition-txt regular-txt">Clouds</h3>
                        </div>
                    </div>

                    <div class="weather-conditions-container">
                        <div class="conditions-item">
                            <span class="material-symbols-outlined">
                                water_drop
                                </span>
                                <div class="conditions-info">
                                    <h5 class="regular-txt">Humidity</h5>
                                    <h5 class="humidity-value-txt">63%</h5>
                                </div>
                        </div>
                            <div class="conditions-item">
                                <span class="material-symbols-outlined">
                                    air
                                    </span> 
                                    <div class="conditions-info">
                                        <h5 class="regular-txt">Wind</h5>
                                        <h5 class="wind-value-txt">5
                                            M/s</h5>
                                    </div>
                    </div>
                    </div>
                    <div class="forecast-items-container">
                        <div class="forecast-item">
                            <h5 class="forecast-item-date regular-txt">02 April</h5>
                            <img src="weather-icons/forecast-thunderstorms.png" class="forecast-item-img">
                            <h5 class="forecast-item-temp">28°C</h5>
                        </div>
                    

                        
                            <div class="forecast-item">
                                <h5 class="forecast-item-date regular-txt">02 April</h5>
                                <img src="weather-icons/forecast-thunderstorms.png" class="forecast-item-img">
                                <h5 class="forecast-item-temp">28°C</h5>
                            </div>
                        

                            
                                <div class="forecast-item">
                                    <h5 class="forecast-item-date regular-txt">02 April</h5>
                                    <img src="weather-icons/forecast-thunderstorms.png" class="forecast-item-img">
                                    <h5 class="forecast-item-temp">28°C</h5>
                                </div>
                            

                                
                                    <div class="forecast-item">
                                        <h5 class="forecast-item-date regular-txt">02 April</h5>
                                        <img src="weather-icons/forecast-thunderstorms.png" class="forecast-item-img">
                                        <h5 class="forecast-item-temp">28°C</h5>
                                    </div>
                    </div>                    
                </div>
</section>

 <section class="search-message search-city">
                    <img src="search-city.jpg" alt="search-city" class="search-city"> 

                    <div>
                        <h1>Search City</h1>
                        <h4 class="regular-txt">
                            Find out the weather conditions of the city
                        </h4>
                    </div>
                </section> 

               <section class="not-found search-city" style="display: none;" >
                    <img src="not-found.jpg" alt="not-found-img" class="not-found"> 

                    <div>
                        <h1>City not found</h1>
                        <h4 class="regular-txt">
                            Try searching for another city
                        </h4>
                    </div>
                </section> 
            </header>
        </main>
        <script src="script.js" defer></script>
    </body>
</html>
